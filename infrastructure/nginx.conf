map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# One JSON line per request. $request_id is passed to the web app and API as
# X-Request-ID, so a single ID ties together gateway, API and error reports.
log_format aside_json escape=json '{"time":"$time_iso8601","request_id":"$request_id","method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,"duration_s":$request_time,"upstream_s":"$upstream_response_time","remote_addr":"$remote_addr","user_agent":"$http_user_agent"}';

server {
  listen 8080;
  server_tokens off;
  client_max_body_size 3m;
  access_log /dev/stdout aside_json;

  # Metrics are for the internal scraper only, never the public gateway.
  location = /metrics { return 404; }

  location /api/v1/ {
    proxy_pass http://api:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Connection "";
  }

  location / {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
