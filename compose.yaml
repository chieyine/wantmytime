services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: aside
      POSTGRES_USER: aside
      POSTGRES_PASSWORD: aside
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - aside-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aside -d aside"]
      interval: 5s
      timeout: 3s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.31.1
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  migrate:
    build:
      context: ./services/core
    command: ["migrate"]
    environment:
      APP_ENV: local
      DATABASE_URL: postgres://aside:aside@db:5432/aside?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./services/core
    environment:
      APP_ENV: local
      API_ADDR: 0.0.0.0:8081
      DATABASE_URL: postgres://aside:aside@db:5432/aside?sslmode=disable
      SESSION_SECRET: local-only-session-secret-change-before-use
      OTP_PEPPER: local-only-otp-pepper-change-before-use
      ALLOW_LOG_OTP: "false"
      # The API is only reachable through the gateway, so X-Forwarded-For is trusted for rate limits.
      TRUST_PROXY_HEADERS: "true"
      LOCAL_PAYMENT_SIMULATOR: "true"
      CHECKOUTS_PAUSED: "true"
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-disabled}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      INTERNATIONAL_CARDS_ENABLED: ${INTERNATIONAL_CARDS_ENABLED:-false}
      REFUNDS_ENABLED: ${REFUNDS_ENABLED:-false}
      REFUND_RECOVERY_MAX_BPS: ${REFUND_RECOVERY_MAX_BPS:-5000}
      PAYMENT_ROUTE: ${PAYMENT_ROUTE:-escrow_payout}
      DISPUTE_WINDOW_MINUTES: ${DISPUTE_WINDOW_MINUTES:-120}
      PAYOUT_DELAY_MINUTES: ${PAYOUT_DELAY_MINUTES:-180}
      PAYOUTS_PAUSED: ${PAYOUTS_PAUSED:-false}
      KORA_SECRET_KEY: ${KORA_SECRET_KEY:-}
      KORA_PUBLIC_KEY: ${KORA_PUBLIC_KEY:-}
      PAYOUT_ACCOUNT_ENCRYPTION_KEY: ${PAYOUT_ACCOUNT_ENCRYPTION_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      CALENDAR_TOKEN_ENCRYPTION_KEY: ${CALENDAR_TOKEN_ENCRYPTION_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      OPS_MFA_ENCRYPTION_KEY: ${OPS_MFA_ENCRYPTION_KEY:-}
      MEETING_LINK_ENCRYPTION_KEY: ${MEETING_LINK_ENCRYPTION_KEY:-}
      PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:-http://127.0.0.1:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_RELEASE: ${APP_RELEASE:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      ALERT_EMAILS: ${ALERT_EMAILS:-}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      ORIGIN: ${PUBLIC_APP_ORIGIN:-http://127.0.0.1:5173}
      API_INTERNAL_BASE: http://api:8081
      APP_ENV: local
      APP_RELEASE: ${APP_RELEASE:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      PUBLIC_SENTRY_DSN: ${PUBLIC_SENTRY_DSN:-}
      PUBLIC_APP_ENV: local
      PUBLIC_APP_RELEASE: ${APP_RELEASE:-}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  gateway:
    image: nginx:1.30.4-alpine3.24
    ports:
      - "127.0.0.1:5173:8080"
    volumes:
      - ./infrastructure/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    restart: unless-stopped

  # Daily verified backups: docker compose --profile ops up -d backup
  # One-off: docker compose run --rm backup once. See docs/OPERATIONS.md.
  backup:
    image: postgres:17.6-alpine
    profiles: ["ops"]
    entrypoint: ["/bin/sh", "/backup/run.sh"]
    command: ["loop"]
    environment:
      DATABASE_URL: postgres://aside:aside@db:5432/aside?sslmode=disable
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_S3_URI: ${BACKUP_S3_URI:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-auto}
    volumes:
      - ./infrastructure/backup:/backup:ro
      - aside-backups:/backups
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  aside-postgres:
  aside-backups:
